[package]
name = "hexcrypt-cli"
description = "Zero-knowledge one-time secret drop: CLI client and self-hostable server in one binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["secrets", "encryption", "zero-knowledge", "one-time", "cli"]
categories = ["command-line-utilities", "cryptography", "web-programming::http-server"]
# dist/ is the built web UI (gitignored); it must exist before `cargo publish`.
include = ["src/**", "build.rs", "dist/**"]

[[bin]]
name = "hexcrypt"
path = "src/main.rs"

[dependencies]
hexcrypt-core = { path = "../hexcrypt-core", version = "0.1.1" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
axum = { version = "0.8", features = ["http1", "tokio"] }
tower-http = { version = "0.7", features = ["set-header"] }
tower_governor = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = { version = "8", features = ["mime-guess"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
