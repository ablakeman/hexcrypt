[package]
name = "hexcrypt"
description = "Zero-knowledge one-time secret drop: CLI client and self-hostable server in one binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "hexcrypt"
path = "src/main.rs"

[dependencies]
hexcrypt-core = { path = "../hexcrypt-core", version = "0.1.0" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-std", "time"] }
axum = { version = "0.8", features = ["http1", "tokio", "json"] }
tower-http = { version = "0.7", features = ["limit", "set-header"] }
tower_governor = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
serde_json = "1"
mime_guess = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
