# Generic self-host: hexcrypt on :8080, put your own TLS proxy in front.
services:
  hexcrypt:
    build: .
    image: hexcrypt:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Only the local proxy can reach the port above, so its X-Real-IP is trustworthy.
      HEXCRYPT_TRUST_PROXY: "true"
