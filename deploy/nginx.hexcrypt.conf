# Drop into /srv/www/celebratingbrent.com/nginx/conf.d/ on sneezy.

# Privacy-trimmed access log for telemetry (deploy/telemetry): IPv4 cut to /24,
# IPv6 to /48, and secret ids replaced with :id, so the log never ties a client
# to a secret. Unparseable addresses become 0.0.0.0 or :: (still valid for GoAccess).
map $remote_addr $hexcrypt_client {
    "~^(?P<net>\d+\.\d+\.\d+)\.\d+$" $net.0;
    "~^(?P<net>[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $net::;
    ~: ::;
    default 0.0.0.0;
}
map $uri $hexcrypt_route {
    ~^/api/v1/secrets/ /api/v1/secrets/:id;
    "~^/[0-9a-f]{12}/?$" /:id;
    default $uri;
}
# Combined log format, prefixed so collect.sh can pick these lines out of docker logs.
log_format hexcrypt 'hexcrypt $hexcrypt_client - - [$time_local] "$request_method $hexcrypt_route $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name hexcrypt.com www.hexcrypt.com;
    access_log /dev/stdout hexcrypt;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://hexcrypt.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hexcrypt.com;
    access_log /dev/stdout hexcrypt;
    ssl_certificate /etc/letsencrypt/live/hexcrypt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexcrypt.com/privkey.pem;
    return 301 https://hexcrypt.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hexcrypt.com;
    access_log /dev/stdout hexcrypt;
    ssl_certificate /etc/letsencrypt/live/hexcrypt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexcrypt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2M;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        resolver 127.0.0.11 valid=30s;
        set $hexcrypt_upstream http://hexcrypt:8080;
        proxy_pass $hexcrypt_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
