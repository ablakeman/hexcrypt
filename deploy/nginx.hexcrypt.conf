# Drop into /srv/www/celebratingbrent.com/nginx/conf.d/ on sneezy.
server {
    listen 80;
    listen [::]:80;
    server_name hexcrypt.com www.hexcrypt.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://hexcrypt.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.hexcrypt.com;
    ssl_certificate /etc/letsencrypt/live/hexcrypt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexcrypt.com/privkey.pem;
    return 301 https://hexcrypt.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hexcrypt.com;
    ssl_certificate /etc/letsencrypt/live/hexcrypt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexcrypt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2M;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        resolver 127.0.0.11 valid=30s;
        set $hexcrypt_upstream http://hexcrypt:8080;
        proxy_pass $hexcrypt_upstream;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
