# Drop into /srv/www/celebratingbrent.com/nginx/conf.d/ on sneezy, next to hexcrypt.conf.
# Needs, in the same directory:
#   telemetry-ips.inc     allow <home IPv4>; deny all;   (.inc: nginx would load a .conf at http level)
#   telemetry.htpasswd    htpasswd file for basic auth
# DNS has only an A record, so browsers connect over IPv4 and the allowlist matches.
server {
    listen 80;
    listen [::]:80;
    server_name telemetry.hexcrypt.com;
    access_log off;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://telemetry.hexcrypt.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name telemetry.hexcrypt.com;
    ssl_certificate /etc/letsencrypt/live/telemetry.hexcrypt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telemetry.hexcrypt.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    include /etc/nginx/conf.d/telemetry-ips.inc;
    auth_basic "hexcrypt telemetry";
    auth_basic_user_file /etc/nginx/conf.d/telemetry.htpasswd;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / {
        resolver 127.0.0.11 valid=30s;
        set $telemetry_upstream http://hexcrypt-telemetry:80;
        proxy_pass $telemetry_upstream;
    }
}
