# Datasette over the telemetry DB, on bw_proxy. / is the dashboard (dashboard/index.html
# overrides Datasette's homepage); the raw tables and SQL are at /telemetry.
# The shared nginx does TLS, the IP allowlist and auth.
#   docker compose -f deploy/telemetry/compose.yaml up -d --build
name: hexcrypt-telemetry
services:
  telemetry:
    build: .
    image: hexcrypt-telemetry:latest
    restart: unless-stopped
    command: >
      datasette serve /data/telemetry.db --host 0.0.0.0 --port 8001
      --metadata /metadata.json --setting sql_time_limit_ms 5000
      --template-dir /dashboard --static dash:/dashboard
    volumes:
      - /srv/www/hexcrypt-telemetry/db:/data:ro
      - ./metadata.json:/metadata.json:ro
      - ./dashboard:/dashboard:ro
    networks:
      proxy:
        aliases:
          - hexcrypt-telemetry
networks:
  proxy:
    external: true
    name: bw_proxy
