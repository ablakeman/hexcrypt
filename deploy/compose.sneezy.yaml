# sneezy.binaryhaze.com: joins the shared bw_proxy network; the
# celebratingbrentcom-nginx-1 container terminates TLS and proxies to hexcrypt:8080.
#   docker compose -f compose.yaml -f deploy/compose.sneezy.yaml up -d --build
services:
  hexcrypt:
    ports: !reset []
    # Secrets live in process memory, bounded by --max-total-bytes (256 MiB default).
    # 1 GiB of RAM covers that with headroom; swap on sneezy's 20G /swapfile absorbs spikes.
    mem_limit: 1g
    memswap_limit: 20g
    networks:
      proxy:
        aliases:
          - hexcrypt
networks:
  proxy:
    external: true
    name: bw_proxy
