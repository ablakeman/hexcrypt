# sneezy.binaryhaze.com: joins the shared bw_proxy network; the
# celebratingbrentcom-nginx-1 container terminates TLS and proxies to hexcrypt:8080.
#   docker compose -f compose.yaml -f deploy/compose.sneezy.yaml up -d --build
services:
  hexcrypt:
    ports: !reset []
    # Secrets live in process memory. Cap resident RAM low and allow lots of swap, so the
    # kernel pushes stored (cold) ciphertext out to sneezy's 20G /swapfile instead of
    # holding it in RAM. cgroup v2 has no per-container swappiness; this limit is the lever.
    mem_limit: 64m
    memswap_limit: 20g
    networks:
      proxy:
        aliases:
          - hexcrypt
networks:
  proxy:
    external: true
    name: bw_proxy
